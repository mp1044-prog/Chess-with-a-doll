<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кукольные шахматы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0806;--ink:#efe3cc;--muted:#a8927a;--wood:#2f1d13;--wood-hi:#4d3122;--brass:#c9a35a;--danger:#e0806f}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus,canvas:focus,input:focus{outline:none}
button:focus-visible,input:focus-visible{outline:2px solid #c9a35a;outline-offset:2px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;min-height:0;position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
#err{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:18px;color:var(--danger);text-align:center;max-width:90%}
#bar{flex:none;background:#140d09;border-top:1px solid #2a1b12;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}
#sur{color:#f1c9bd;border-color:#6a2c22;background:#2a110c}
#sur:hover{background:#3d1a12}
button[hidden]{display:none}
#opts,#opts button,#sur,#cardInfo,#cardInfo *,#cap,#dpad button,#pick4 button,#err{font-family:'Press Start 2P','Courier New',monospace!important;-webkit-font-smoothing:none;letter-spacing:0}
#opts,#sur,#dpad button,.gear,#cardInfo,#pick4 button{border-radius:0!important}
#opts{border-width:2px!important;box-shadow:0 0 0 2px #120b08}
#opts .vol{display:flex;flex-direction:column;gap:6px;padding:9px 12px;border-bottom:1px solid #2d1e16}
#opts .vol label{font-size:10px;color:var(--muted)}
#opts input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#120b08;border:2px solid #5a4030;margin:0}
#opts input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:#c9a35a;border:2px solid #120b08;cursor:pointer}
#opts input[type=range]::-moz-range-thumb{width:10px;height:16px;background:#c9a35a;border:2px solid #120b08;border-radius:0;cursor:pointer}
#cap{font-size:12px!important;line-height:1.7!important}
#cardInfo .ct{font-size:13px!important}#cardInfo .cx{font-size:10px!important;line-height:1.7!important}#cardInfo .ch{font-size:9px!important;line-height:1.6!important;font-style:normal!important}
#pick4 button{font-size:10px!important;padding:6px 8px!important}
#sur{font-size:9px!important}
#look{display:none!important}
.gear{position:absolute;left:10px;top:10px;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(20,12,9,.85);border:1px solid #5a4030;display:flex;align-items:center;justify-content:center;z-index:6}
.gear canvas{width:26px;height:26px;image-rendering:pixelated}
.gear[aria-expanded="true"]{border-color:#c9a35a}
#opts{position:absolute;left:10px;top:60px;z-index:6;display:flex;flex-direction:column;min-width:250px;max-width:calc(100vw - 20px);background:rgba(16,10,8,.96);border:1px solid #5a4030;border-radius:10px;padding:4px}
#opts[hidden]{display:none}
#opts button{background:none;border:0;border-bottom:1px solid #2d1e16;border-radius:0;text-align:left;padding:11px 12px;font-size:11px;line-height:1.6;color:var(--ink)}
#opts button:last-child{border-bottom:0}
#opts button:hover{background:#2a1a12}
#grin{text-align:center!important;display:flex;justify-content:center;padding:8px!important}
#grin canvas{width:30px;height:30px;image-rendering:pixelated}
#grin[aria-pressed="true"]{background:#3a2216!important;box-shadow:inset 0 0 0 1px #c9a35a}
#hud{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .sp{flex:1;pointer-events:none}
#sur{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px;border-radius:10px;font-size:14px;background:#2a110c;border:1px solid #6a2c22;color:#f1c9bd}
#sur[hidden]{display:none}
#sur .fl{width:18px;height:18px;background:linear-gradient(#f1c9bd,#f1c9bd) 2px 1px/2px 16px no-repeat,linear-gradient(#f1c9bd,#f1c9bd) 4px 1px/11px 8px no-repeat}
#dpad{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px);gap:2px;flex:none;opacity:.6;transition:opacity .2s}
#dpad:active,#dpad:focus-within{opacity:1}
#dpad canvas{width:14px;height:14px;image-rendering:pixelated;display:block;margin:auto}
#sur canvas{width:22px;height:22px;image-rendering:pixelated;display:block}
#dpad button{width:32px;height:32px;padding:0;border-radius:6px;background:rgba(20,12,9,.85);border:1px solid #5a4030;color:#e8dcc8;font-size:14px;touch-action:none;-webkit-user-select:none;user-select:none}
#dpad button:active,#dpad button.hold{background:#4d3122;border-color:#c9a35a}
@media (hover:hover) and (pointer:fine){#dpad{display:none!important}}
#dpad .du{grid-column:2;grid-row:1}#dpad .dl{grid-column:1;grid-row:2}#dpad .dr{grid-column:3;grid-row:2}#dpad .dd{grid-column:2;grid-row:3}
#cards{position:absolute;left:0;top:0;display:flex;align-items:flex-end;z-index:4;transform:translate(-50%,-100%);transform-origin:50% 100%;transition:transform .3s ease,opacity .3s ease}
#cards.away{transform:translate(-50%,-55%) scale(.35);opacity:0;pointer-events:none}
#cards[hidden],#pick4[hidden]{display:none}
.card{position:relative;width:46px;height:69px;margin:0 -5px;transform:rotate(var(--r,0deg)) translateY(var(--y,0px));transform-origin:50% 100%;padding:0;border:0;border-radius:6px;background:none;cursor:pointer;transition:transform .15s,filter .15s}
.card canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.card:hover{transform:rotate(var(--r,0deg)) translateY(calc(var(--y,0px) - 6px))}
.card.on{z-index:2;transform:rotate(var(--r,0deg)) translateY(calc(var(--y,0px) - 18px));filter:drop-shadow(0 0 7px #ffd66b)}
.card.cool{filter:saturate(.35) brightness(.7)}
.card .cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#efe3cc;font-size:24px;border-radius:6px}
#dcard{position:absolute;right:14px;top:14px;transform:scale(.6);width:96px;height:144px;opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .3s;pointer-events:none;z-index:4;filter:drop-shadow(0 0 14px rgba(120,160,255,.55))}
#dcard.show{opacity:1;transform:scale(1)}
#dcard canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#cardInfo{position:absolute;left:62px;right:10px;margin:0 auto;top:12px;max-width:360px;background:rgba(20,12,9,.92);border:1px solid #6e4f36;border-radius:10px;padding:8px 12px;z-index:4;color:var(--ink)}
#cardInfo[hidden]{display:none}
#cardInfo .ct{font-size:18px;color:#c9a35a}
#cardInfo .cx{font-size:14.5px;line-height:1.3;margin-top:2px}
#cardInfo.compact{padding:6px 8px}
#cardInfo.compact .ct,#cardInfo.compact .cx,#cardInfo.compact .ch{display:none}
#cardInfo.compact #pick4{margin:0}
#cardInfo .ch{font-size:13.5px;color:var(--muted);margin-top:4px;font-style:italic}
#pick4{display:flex;gap:6px;margin:8px 0 2px;flex-wrap:wrap}
#pick4 button.sel{border-color:#c9a35a;color:#f6e7c4;background:#4d3122}
#note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5}
#note[hidden]{display:none}
.paper{position:relative;width:min(90vw,460px);aspect-ratio:3/2;filter:drop-shadow(0 12px 22px rgba(0,0,0,.75))}
.paper canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.pbtn{position:absolute;background:transparent;border:0;border-radius:50%;color:transparent;font-size:1px;padding:0;cursor:pointer}
.pbtn:hover{background:rgba(40,30,25,.08)}
.pbtn:focus-visible{outline:2px dashed #2b1a12;outline-offset:-3px}
.top .btns{margin-left:auto}
#bub{position:absolute;left:0;top:0;transform:translateX(-50%);width:min(84vw,330px);z-index:4;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#bub[hidden]{display:none}
#bub .o,#bub .i{clip-path:polygon(8px 12px,calc(50% - 9px) 12px,50% 0,calc(50% + 9px) 12px,calc(100% - 8px) 12px,100% 20px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 20px)}
#bub .o{background:#8e2a2a;padding:2px}
#bub .i{background:#1a0b0b;padding:20px 16px 14px;min-height:40px}
#bub .tx{font-family:'Press Start 2P','Courier New',monospace;color:#f0c9bd;font-size:12px;line-height:1.8;text-align:center;letter-spacing:0;position:relative;-webkit-font-smoothing:none;font-smooth:never}
#bub .gh{visibility:hidden}
#bub .vis{position:absolute;inset:0}
#bub .nx{position:absolute;right:12px;bottom:6px;color:#c95a50;font-family:'Press Start 2P',monospace;font-size:9px;opacity:0}
#cap{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:92%;text-align:center;font-size:21px;line-height:1.25;color:var(--ink);text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none;opacity:0;transition:opacity .5s}
.btns,#opts{display:flex;gap:6px;flex-wrap:wrap}
#opts{justify-content:flex-end;align-items:center}
#opts[hidden]{display:none}
button{font-family:inherit;font-size:16px;color:var(--ink);background:var(--wood);border:1px solid var(--wood-hi);border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--wood-hi)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#ng{border-color:var(--brass);color:#f6e7c4}
.hint{font-size:15px;color:var(--muted);margin-right:auto}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Шахматная доска с кукольными руками"></canvas><div id="cap" aria-live="polite"></div><div id="bub" hidden aria-live="polite"><div class="o"><div class="i"><div class="tx"><span class="gh"></span><span class="vis"></span></div></div></div><span class="nx">▼</span></div><div id="dcard" aria-hidden="true"><canvas width="40" height="60"></canvas></div><div id="cardInfo" hidden role="status"><div class="ct"></div><div class="cx"></div><div id="pick4" hidden><button data-t="1">Ладья</button><button data-t="2">Конь</button><button data-t="3">Слон</button><button data-t="x">Отмена</button></div><div class="ch"></div></div><div id="note" hidden role="dialog" aria-label="Записка куклы"><div class="paper"><canvas id="paperCv" width="240" height="160" role="img" aria-label="Хочешь сделать игру веселее?"></canvas><button id="yes" class="pbtn" style="left:3%;top:63%;width:46%;height:27%">Согласиться</button><button id="no" class="pbtn" style="left:52%;top:62%;width:44%;height:27%">Отказаться</button></div></div><div id="err"></div>
<button id="more" class="gear" aria-label="Меню" aria-expanded="false" aria-controls="opts"><canvas width="13" height="13"></canvas></button>
<div id="opts" hidden role="menu"><button id="ng">↻ Новая игра</button><button id="snd">♪ Звук: выкл</button><div class="vol"><label for="vMaster">Общая громкость</label><input type="range" id="vMaster" min="0" max="100" step="5"></div><div class="vol"><label for="vMusic">Музыка</label><input type="range" id="vMusic" min="0" max="100" step="5"></div><div class="vol"><label for="vAmb">Фоновый звук</label><input type="range" id="vAmb" min="0" max="100" step="5"></div><div hidden><button id="jt"></button><button id="nl"></button><button id="sk"></button></div><button id="capsBtn">▤ Подсказки сверху: вкл</button><button id="hintReset">✎ Подсказки карт заново</button><button id="grin" aria-pressed="false" aria-label="Кнопка «Сдаться» всегда видна" title="Кнопка «Сдаться» всегда видна"><canvas width="13" height="13"></canvas></button></div>
<div id="cards" hidden><button class="card" data-k="skip" aria-label="Карта: пропуск хода"><canvas width="40" height="60"></canvas><span class="cd"></span></button><button class="card" data-k="rev" aria-label="Карта: смена стороны"><canvas width="40" height="60"></canvas><span class="cd"></span></button><button class="card" data-k="p1" aria-label="Карта: плюс один"><canvas width="40" height="60"></canvas><span class="cd"></span></button><button class="card" data-k="p4" aria-label="Карта: плюс четыре"><canvas width="40" height="60"></canvas><span class="cd"></span></button></div><div id="hud"><div id="dpad" role="group" aria-label="Обзор"><button data-d="u" class="du" aria-label="Посмотреть вверх, на куклу"><canvas width="7" height="7"></canvas></button><button data-d="l" class="dl" aria-label="Посмотреть влево"><canvas width="7" height="7"></canvas></button><button data-d="r" class="dr" aria-label="Посмотреть вправо"><canvas width="7" height="7"></canvas></button><button data-d="d" class="dd" aria-label="Посмотреть вниз, на стол"><canvas width="7" height="7"></canvas></button></div><div class="sp"></div><button id="sur" hidden aria-label="Сдаться" title="Сдаться"><canvas width="11" height="11"></canvas></button></div>
<button id="look" hidden></button>
</div>

<script>
let learned={};try{learned=JSON.parse(localStorage.getItem('kukla_learned')||'{}')||{}}catch(e){learned={}}
const saveLearned=()=>{try{localStorage.setItem('kukla_learned',JSON.stringify(learned))}catch(e){}};
let NPw=[0,-999,0],NRa=[1,0,0,0,1,0,0,0,1],NA=0,DPw=[0,-999,0],DRa=[1,0,0,0,1,0,0,0,1],DA=0,dieOnTable=false,funMode=false;
let KPw=[0,-999,0],KRa=[1,0,0,0,1,0,0,0,1],KA=0,KK=0,KP2w=[0,-999,0],KR2a=[1,0,0,0,1,0,0,0,1],KA2=0,KK2=0,pdAnim=null;
function playerDiscard(k){const yaw=(Math.random()-.5)*.7,spin=(Math.random()<.5?-1:1)*(1.6+Math.random()*1.2);pdAnim={t:0,k:{skip:0,rev:1,p1:2,p4:3}[k],yaw,spin,from:[XM+40,95,-330],to:[XM+170,.45,-268]}}
function pdUpdate(dt){if(!pdAnim)return;const A=pdAnim;A.t+=dt;const x=Math.min(A.t/.55,1),e=1-Math.pow(1-x,3);
const c=[lerp(A.from[0],A.to[0],e),lerp(A.from[1],A.to[1],x*x)+18*Math.sin(Math.PI*x)*(1-x),lerp(A.from[2],A.to[2],e)];
const a=A.yaw+A.spin*(1-e),tilt=(1-e)*.9;const n=[Math.sin(tilt)*Math.cos(a),Math.cos(tilt),Math.sin(tilt)*Math.sin(a)];const l=[Math.cos(a),0,-Math.sin(a)];
const F=orthoFrame(c,n,l);KP2w=F.c;KR2a=[...F.n,...F.l,...F.s];KA2=1;KK2=A.k;if(x>=1){pdAnim=null;placeSnd()}}
let dDeck=false,DP2w=[0,-999,0],DR2a=[1,0,0,0,1,0,0,0,1],DA2=0,dcd={skip:0,rev:0,p1:0,p4:0},dUsed={},dskipPending=false,dollCardTurn=false,rotBy='player',dollSkipMsg='';
const CDL={p1:3,skip:4,p4:5,rev:6};
let armed=null,cardsHidden=false,cd={skip:0,rev:0,p1:0,p4:0},usedNow={},skipPending=false,target=null,boardRotT=-1,BROTv=0;
let openOn=false,openWall=0,openT=-1,LIGHTv=1,BOARDTv=99,skipStart=false,talk=null,talkMO=.07,talkEye=1,MSv=0,autoSay=null,lastMinor=-99,bags={},idleT=0,idleSaid=false,doomSaid=false,surrPending=false;
let winsE=0,lossesE=0,mouthOn=false,nextSigh=25,sighT=-99;
let surrCount=0,noteDone=false,noteAt=4,dollMoves=0,waitingNote=false,noteTaken=false,noteChoice=null;
const noteEl=document.getElementById('note');
let RX=200,RY=200;
const cv=document.getElementById('c');const gl=cv.getContext('webgl2');const capEl=document.getElementById('cap');let capText='',capTimer=0;const CAPOK=/кулак|Белые!|Чёрные\.|Шах|Мат|Пат|подглядывай|[Кк]арт|пропускает|раздала|Доска/;
let capsOn=true;try{capsOn=localStorage.getItem('kukla_caps')!=='0'}catch(e){}
const stEl={get textContent(){return capText},set textContent(v){capText=v;clearTimeout(capTimer);if(!capsOn){capEl.style.opacity=0;return}if(CAPOK.test(v)){capEl.textContent=v.replace(/ Кукла думает…/,'');capEl.style.opacity=1;if(!/кулак|Мат|Пат/.test(v))capTimer=setTimeout(()=>{capEl.style.opacity=0},3200)}else capEl.style.opacity=0}};
const SK=[
{n:'светлая',t:['#5e2f2b','#7d4139','#9c584c','#b87262','#cd8b78','#dca08b','#e8b4a0','#f0c6b4','#f7d9ca','#fcebe1'],red:'#e2766f'},
{n:'смуглая',t:['#2f1a13','#45261b','#5c3324','#74432f','#8b553b','#9f6849','#b27b58','#c38f6b','#d4a481','#e3b998'],red:'#a8443f'},
{n:'фарфор',t:['#6a4a55','#86606b','#a27a82','#bb959a','#ceaeb0','#dec4c3','#ebd7d4','#f4e5e1','#faf0ec','#fffaf7'],red:'#ee9aa4'}];
const NLS=[{n:'розовый нюд',bed:'#e4a9a3',tip:'#f7e9e5',dk:'#8f5652',edge:'#b9807a'},{n:'красный лак',bed:'#c4243b',tip:'#c92a40',dk:'#5a0b18',edge:'#7d1224'}];
const WOOD=['#2e1a10','#40251a','#563222','#6b3f2a','#7f4f33','#93603d','#a6724a','#b98658'];
const MAPLE=['#5e4630','#7a5f40','#987b54','#b5986a','#cdb282','#e2cb9e'];
const WALNUT=['#170e09','#24160e','#331f14','#45291b','#583624','#6c442e'];
const IVORY=['#4f4030','#75644d','#9c8a6c','#c2b08e','#ded0b0','#f4ead2'];
const EBONY=['#070505','#110c0b','#1d1614','#2b221f','#3d312c','#54453e'];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const D2R=Math.PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],lerp=(a,b,t)=>a+(b-a)*t;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len=a=>Math.hypot(a[0],a[1],a[2]);
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const FB=[[-16.5,2.5,-7,[15,11,10]],[-5.8,1.5,-2.5,[22,14.5,12]],[5.6,0,1,[23.5,15.5,13]],[16.5,2.5,4,[21.5,14,12]]];
const FR=[[3.9,3.6,3.3,2.9],[4.4,4.2,3.8,3.3],[4.6,4.4,3.9,3.4],[4.5,4.2,3.8,3.3],[7.2,5.6,5,4.4]];
const TB=[[19.5,46],[28.5,24],[32,10],[33.5,-3]],TZ=[-4,-4.5,-5,-5.5];
const mm=(a,b)=>a.map(r=>[0,1,2].map(j=>r[0]*b[0][j]+r[1]*b[1][j]+r[2]*b[2][j]));
function makeM(yaw,pitch,roll,tw){roll=roll||0;tw=tw||0;const sp=Math.sin(pitch),cp=Math.cos(pitch),sy=Math.sin(yaw),cy=Math.cos(yaw),sr=Math.sin(roll),cr=Math.cos(roll),st=Math.sin(tw),ct=Math.cos(tw);
const MX=[[1,0,0],[0,sp,cp],[0,-cp,sp]],RYm=[[cy,0,sy],[0,1,0],[-sy,0,cy]],RL=[[cr,0,sr],[0,1,0],[-sr,0,cr]],RZ=[[ct,-st,0],[st,ct,0],[0,0,1]];return mm(mm(mm(RYm,MX),RL),RZ)}
const mul=(m,v)=>[m[0][0]*v[0]+m[0][1]*v[1]+m[0][2]*v[2],m[1][0]*v[0]+m[1][1]*v[1]+m[1][2]*v[2],m[2][0]*v[0]+m[2][1]*v[1]+m[2][2]*v[2]];

else if(k==='rev'){playerDiscard(k);cancelTarget();busy=true;boardRotT=0;cd.rev=CDL.rev;usedNow.rev=true;stEl.textContent='Карта «Смена стороны»: Доска поворачивается!'}
else{if(!target){stEl.textContent='Карта +4: сначала выберите фигуру';return}if(sq>=0&&selMoves.some(q=>q.t===sq)){placeCard(sq);armed=null;cardsKey=''}else stEl.textContent='Карту можно бросить только на подсвеченную клетку'}}

function hitDeck(cx,cy){if(!dieOnTable||!DA)return false;const{ro,rd}=rayAt(cx,cy);const ax=[DRa.slice(0,3),DRa.slice(3,6),DRa.slice(6,9)],he=[6,31,21];const o=sub(ro,DPw);let t0=-1e9,t1=1e9;
for(let i=0;i<3;i++){const e=dot(ax[i],o),f=dot(ax[i],rd);if(Math.abs(f)<1e-6){if(Math.abs(e)>he[i])return false;continue}let a=(-he[i]-e)/f,b=(he[i]-e)/f;if(a>b)[a,b]=[b,a];t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return false}return t1>0}
function toggleCards(){cardsHidden=!cardsHidden;if(cardsHidden){if(armed)cancelTarget();stEl.textContent='Карты убраны в колоду'}else stEl.textContent='Вы взяли карты';placeSnd()}
function placeCard(sq){const k=target.k,t=target.t;playerDiscard(k);say(k==='p1'?'p1':'p4_'+t,true);learned[k]=true;saveLearned();target=null;selMoves=[];cd[k]=CDL[k];usedNow[k]=true;busy=true;const val=playerSide*8+t;const c=sqC(dIdx(sq));let tt=0;
jobs.push({h:-1,step(dt){tt+=dt;const x=Math.min(tt/.55,1);MPv[0]=[c[0],BH+90*(1-x*x),c[1],t];MPC[0]=playerSide;MPA[0]=1;if(x>=1){MPA[0]=0;const b=state.b.slice();b[sq]=val;state=Object.assign({},state,{b});disp=b.slice();placeSnd();busy=false;stEl.textContent='';return true}return false}})}

const A={u:up,r:rot(up,1),d:rot(up,2),l:rot(up,3)};document.querySelectorAll('#dpad button').forEach(b=>spr(b.querySelector('canvas'),A[b.dataset.d],{X:'#e8dcc8'}));

const lookBtn=document.getElementById('look');lookBtn.onclick=()=>{if(camLock)return;lookTo=(lookTo!==null?lookTo:look)>.5?0:1};
window.addEventListener('keydown',e=>{if(camLock)return;const KM={KeyW:'u',KeyS:'d',KeyA:'l',KeyD:'r',ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(KM[e.code]){e.preventDefault();nav(KM[e.code]);return}if(e.key==='+'||e.key==='=')setZoom(ZM/1.12);else if(e.key==='-'||e.key==='_')setZoom(ZM*1.12)});
